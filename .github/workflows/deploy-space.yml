name: Deploy to Hugging Face Space

# Every push to main mirrors the app to a Hugging Face Space (creating it on the first run).
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret
#   HF_TOKEN = a Hugging Face access token with "Write" permission
# Optional repository variable HF_SPACE_NAME (defaults to agentic-rag-docqa).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=1.0"
      - name: Create Space if needed and upload app
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: ${{ vars.HF_SPACE_NAME || 'agentic-rag-docqa' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret not set; skipping Space deploy."
            exit 0
          fi
          python scripts/deploy_space.py
