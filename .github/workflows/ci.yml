name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Unit tests + eval regression gate
        run: pytest -q
      - name: Offline eval report
        run: python -m eval.run_eval --embedder hash

  eval-semantic:
    # Same labeled eval with the real MiniLM embeddings the live app uses, for both vector stores.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-ci.txt "sentence-transformers>=3.0"
      - name: Run eval (MiniLM)
        run: |
          python -m eval.run_eval --store faiss  | tee eval-faiss.json
          python -m eval.run_eval --store chroma | tee eval-chroma.json
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("| store | hit@4 | MRR | answer acc. | citation precision | abstention |")
          print("|---|---|---|---|---|---|")
          for s in ("faiss", "chroma"):
              r = json.load(open(f"eval-{s}.json"))
              print(f"| {s} | {r['hit@4']} | {r['mrr']} | {r['answer_accuracy']} | {r['citation_precision']} | {r['abstention_accuracy']} |")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-*.json
